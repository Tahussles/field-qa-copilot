[project]
name = "field-qa-copilot"
version = "0.1.0"
description = "Detection engine and API for Field QA Copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
]

[dependency-groups]
datagen = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
]
dev = [
    "pytest>=9.2.0",
    "uvicorn>=0.38",
]

[tool.uv]
package = false
# uv run and uv sync install both groups locally; Vercel installs only [project] dependencies.
default-groups = ["dev", "datagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
